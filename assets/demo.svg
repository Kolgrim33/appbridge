<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <style>
    .bg { fill: #0B0F17; stroke: #1E293B; stroke-width: 2; }
    .bar { fill: #111827; }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; fill: #E2E8F0; }
    .title { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #94A3B8; }
    .p { fill: #F97316; font-weight: 700; }
    .c { fill: #38BDF8; font-weight: 600; }
    .ok { fill: #4ADE80; font-weight: 600; }
    .m { fill: #64748B; }
    .s1 { animation: a1 14s infinite } .s2 { animation: a2 14s infinite }
    .s3 { animation: a3 14s infinite } .s4 { animation: a4 14s infinite }
    .s5 { animation: a5 14s infinite } .s6 { animation: a6 14s infinite }
    @keyframes a1 { 0%,2% {opacity:0} 6%,100% {opacity:1} }
    @keyframes a2 { 0%,12% {opacity:0} 16%,100% {opacity:1} }
    @keyframes a3 { 0%,34% {opacity:0} 38%,100% {opacity:1} }
    @keyframes a4 { 0%,44% {opacity:0} 48%,100% {opacity:1} }
    @keyframes a5 { 0%,66% {opacity:0} 70%,100% {opacity:1} }
    @keyframes a6 { 0%,76% {opacity:0} 80%,100% {opacity:1} }
  </style>
  <rect x="2" y="2" width="896" height="516" rx="14" class="bg"/>
  <path d="M2 16Q2 2 16 2H884Q898 2 898 16V40H2Z" class="bar"/>
  <circle cx="24" cy="21" r="6.5" fill="#EF4444"/><circle cx="46" cy="21" r="6.5" fill="#F59E0B"/><circle cx="68" cy="21" r="6.5" fill="#10B981"/>
  <text x="450" y="26" text-anchor="middle" class="title">appbridge</text>

  <g class="s1"><text x="24" y="70" class="t"><tspan class="p">❯</tspan> <tspan class="c">appbridge plan</tspan> recipes/windows-dx12-game.appbridge.toml</text></g>
  <g class="s2">
    <text x="24" y="96" class="t"><tspan class="m">Source               :</tspan> Windows Executable (.exe) (x86_64)</text>
    <text x="24" y="116" class="t"><tspan class="m">Target Host          :</tspan> Linux (x86_64)</text>
    <text x="24" y="136" class="t"><tspan class="m">Recommended Strategy :</tspan> <tspan class="ok">Windows compatibility layer (Wine)</tspan></text>
    <text x="24" y="156" class="t"><tspan class="m">Score                :</tspan> 88/100 <tspan class="m">(no kernel-level anti-cheat found)</tspan></text>
  </g>

  <g class="s3"><text x="24" y="206" class="t"><tspan class="p">❯</tspan> <tspan class="c">appbridge convert</tspan> studio-code.deb --to arch --output studio-code.pkg.tar.zst</text></g>
  <g class="s4">
    <text x="24" y="232" class="t"><tspan class="m">Mode          :</tspan> Native Package Repackaging</text>
    <text x="24" y="252" class="t"><tspan class="m">Transform     :</tspan> Debian Package (.deb) -&gt; Arch Linux Package (.pkg.tar.zst)</text>
    <text x="24" y="272" class="t"><tspan class="m">Mapped Deps   :</tspan> <tspan class="ok">glibc, gtk3</tspan></text>
    <text x="24" y="292" class="t"><tspan class="ok">SAFE_TO_CONVERT</tspan> <tspan class="m">- installs with</tspan> pacman -U studio-code.pkg.tar.zst</text>
  </g>

  <g class="s5"><text x="24" y="342" class="t"><tspan class="p">❯</tspan> <tspan class="c">appbridge verify-bundle</tspan> winemine.appbridge</text></g>
  <g class="s6">
    <text x="24" y="368" class="t"><tspan class="m">Application   :</tspan> winemine v1.0.0</text>
    <text x="24" y="388" class="t"><tspan class="m">Deployment    :</tspan> CompatibilityLayerPayload <tspan class="m">(backend: wine)</tspan></text>
    <text x="24" y="408" class="t"><tspan class="m">Integrity OK  :</tspan> <tspan class="ok">true</tspan></text>
    <text x="24" y="428" class="t"><tspan class="m">Verified      :</tspan> manifest.toml, payload/winemine.exe, sbom.cdx.json, provenance.json ...</text>
  </g>
</svg>
