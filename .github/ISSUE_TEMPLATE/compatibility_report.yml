name: App compatibility report
description: Share whether a real-world app or game ran or converted cleanly with AppBridge
labels: ["compatibility"]
body:
  - type: input
    id: app-name
    attributes:
      label: Application name & version
      placeholder: e.g. FooApp 2.4.1 (.deb / .exe)
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Result
      options:
        - Worked cleanly (SAFE_TO_CONVERT / ran without issues)
        - Worked with warnings (CONVERT_WITH_WARNINGS / minor glitches)
        - Blocked or failed (UNSUPPORTED / crash)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host OS, kernel, and backend
      placeholder: Arch Linux x86_64, Wine 9.x / pacman
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Plan output & notes
      description: Paste `appbridge plan` output or any workarounds you used.
      render: shell
