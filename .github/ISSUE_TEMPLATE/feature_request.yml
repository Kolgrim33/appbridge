name: Feature request
description: Propose a new backend, package target, or CLI/SDK capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow are you trying to enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the CLI flags, crate API, or behavior you have in mind.
    validations:
      required: true
