[workspace]
resolver = "2"
members = [
    "crates/bridge-spec",
    "crates/bridge-core",
    "crates/bridge-inspect",
    "crates/bridge-detect",
    "crates/bridge-planner",
    "crates/bridge-resolver",
    "crates/bridge-security",
    "crates/bridge-state",
    "crates/bridge-desktop",
    "crates/bridge-runner",
    "crates/bridge-bundle",
    "crates/bridge-convert",
    "crates/bridge-build",
    "crates/bridge-backend-api",
    "crates/bridge-backend-native",
    "crates/bridge-backend-wine",
    "crates/bridge-backend-distrobox",
    "crates/bridge-backend-wsl",
    "crates/bridge-backend-vm",
    "crates/bridge-backend-darling",
    "apps/cli",
    "apps/desktop",
    "benchmarks",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Selby Mashiki"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
goblin = "0.9"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tempfile = "3.10"
ar = "0.9"
tar = "0.4"
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

bridge-spec = { path = "crates/bridge-spec" }
bridge-detect = { path = "crates/bridge-detect" }
bridge-security = { path = "crates/bridge-security" }
bridge-inspect = { path = "crates/bridge-inspect" }
bridge-resolver = { path = "crates/bridge-resolver" }
bridge-backend-api = { path = "crates/bridge-backend-api" }
bridge-planner = { path = "crates/bridge-planner" }
bridge-state = { path = "crates/bridge-state" }
bridge-desktop = { path = "crates/bridge-desktop" }
bridge-runner = { path = "crates/bridge-runner" }
bridge-bundle = { path = "crates/bridge-bundle" }
bridge-convert = { path = "crates/bridge-convert" }
bridge-build = { path = "crates/bridge-build" }
bridge-backend-native = { path = "crates/bridge-backend-native" }
bridge-backend-wine = { path = "crates/bridge-backend-wine" }
bridge-backend-distrobox = { path = "crates/bridge-backend-distrobox" }
bridge-backend-wsl = { path = "crates/bridge-backend-wsl" }
bridge-backend-vm = { path = "crates/bridge-backend-vm" }
bridge-backend-darling = { path = "crates/bridge-backend-darling" }
bridge-core = { path = "crates/bridge-core" }
